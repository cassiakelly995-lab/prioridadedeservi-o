<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prioridade de Serviço</title>
<meta name="description" content="Registro diário das obrigações do serviço, com calendário, compromissos e cores.">
<meta name="theme-color" content="#f4f7fe" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Prioridade">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e4;--card:#fffaf0;--ink:#3a2412;--mut:#7d6650;--line:#ecdcc0;--ac:#e9a10f;--acx:#3a2412;--br:#7a4a08;--g:#2e9e6b;--y:#e8a400;--r:#d6453d;--cad:#7b3fe4;--def:#2f7de1;--adm:#0f9d94;--ate:#d9468f;--pes:#7a7f8c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d140c;--card:#2a1e13;--ink:#f6e9d3;--mut:#c3ab8c;--line:#42301f;--ac:#f5b73a;--acx:#2a1a0c;--br:#f5b73a;--g:#4cc58a;--y:#f2bd3a;--r:#ff7a70}}
:root[data-theme="dark"]{--bg:#1d140c;--card:#2a1e13;--ink:#f6e9d3;--mut:#c3ab8c;--line:#42301f;--ac:#f5b73a;--acx:#2a1a0c;--br:#f5b73a;--g:#4cc58a;--y:#f2bd3a;--r:#ff7a70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;padding-bottom:150px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:23px;margin:0;line-height:1.2}h2{font-size:18px;margin:20px 0 8px}
.sub{color:var(--mut);font-size:15px}.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:4px 0 10px}
label{font-size:15px;color:var(--mut)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{border-radius:20px;padding:16px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.hm-tranquilo{background:color-mix(in srgb,var(--g) 22%,var(--card))}.hm-corrido{background:color-mix(in srgb,var(--y) 26%,var(--card))}.hm-pesado{background:color-mix(in srgb,var(--r) 22%,var(--card))}
.moods{display:flex;gap:8px;margin-top:12px}
.mood{flex:1;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:15px}
.mood i{display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 4px}
.mood.on{border-color:var(--ink);font-weight:700}
.bg-g{background:var(--g)}.bg-y{background:var(--y)}.bg-r{background:var(--r)}
.it{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:7px solid var(--y);border-radius:14px;padding:12px;margin-bottom:8px}
.p-urgente{border-left-color:var(--r)}.p-normal{border-left-color:var(--y)}.p-leve{border-left-color:var(--g)}
.it.dn{opacity:.55}.it.dn b{text-decoration:line-through}
.ck{width:32px;height:32px;border-radius:50%;border:2px solid var(--mut);background:none;flex:none;font-size:18px;line-height:1;color:var(--acx);padding:0}
.dn .ck{background:var(--g);border-color:var(--g)}
.meta{font-size:14px;color:var(--mut);margin-top:2px}
.tg{display:inline-block;padding:0 8px;border-radius:8px;color:#fff;font-size:13px}
.t-cad{background:var(--cad)}.t-defensoria{background:var(--def)}.t-admin{background:var(--adm)}.t-atendimento{background:var(--ate)}.t-pessoal{background:var(--pes)}
.lt{color:var(--r);font-weight:700}
.icb{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{text-align:center;font-size:13px;color:var(--mut)}
.cd{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-size:16px;position:relative}
.cd em{font-style:normal;font-size:11px;background:var(--ac);color:var(--acx);border-radius:8px;padding:0 6px;margin-top:2px}
.cd em.lt2{background:var(--r);color:#fff}
.cd.today{border:2px solid var(--ac);font-weight:700}.cd.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 40%,transparent)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:12px}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:14px;height:14px;border-radius:5px}
.chips{display:flex;gap:8px;margin-bottom:10px}.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px}.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar span{display:block;height:100%}
.empty{text-align:center;color:var(--mut);padding:24px 10px}
.pri{background:var(--ac);color:var(--acx);border:0;border-radius:14px;padding:12px 18px;font-weight:700}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:var(--acx);border:0;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:13px;color:var(--mut)}nav button b{display:block;font-size:20px}
nav button.on{color:var(--br);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20}
[hidden]{display:none!important}
.top{max-width:640px;margin:0 auto;padding:14px 14px 0;display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;border-radius:50%;flex:none}.top b{display:block;font-size:19px;line-height:1.15}.top span{font-size:14px;color:var(--mut)}
#inst{margin-left:auto;padding:9px 14px}
.sloth{display:block;margin:0 auto 8px;width:96px;height:96px;border-radius:50%}
/* ===== Tema azul elétrico, claro e escuro automático ===== */
:root:root:root{color-scheme:light dark;--bg:#f4f7fe;--card:#fff;--ink:#0f1b33;--mut:#5b6b8c;--line:#dce5f6;--ac:#1a6bff;--acx:#fff;--br:#1553cc;--g:#12b76a;--y:#f5a300;--r:#f04438;--cad:#7a5af8;--def:#0ba5ec;--adm:#12b5a5;--ate:#ee46bc;--pes:#667085;--sh:0 1px 2px rgba(16,40,90,.08),0 8px 24px rgba(16,40,90,.08)}
@media (prefers-color-scheme:dark){:root:root:root{--bg:#0b1220;--card:#131c30;--ink:#e8eefc;--mut:#9fb0d0;--line:#243250;--ac:#6ea2ff;--acx:#06132e;--br:#8db6ff;--g:#32d583;--y:#fdb022;--r:#f97066;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
h1,h2,.top b,.cd,.cnt,svg text,nav button{font-family:"Manrope","Atkinson Hyperlegible",system-ui,sans-serif}
h2{font-size:14px;color:var(--mut);font-weight:800;letter-spacing:.02em}
.hero,.card,.it{box-shadow:var(--sh)}.hero{border-radius:26px}.it{border-radius:16px}
.pri{background:var(--ac);color:var(--acx);border:0;box-shadow:0 6px 16px -6px var(--ac)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:0;border-radius:28px;padding:0;box-shadow:0 12px 32px rgba(16,40,90,.22);max-width:616px;margin:0 auto}
nav button.on{color:var(--br)}nav button.on b{background:color-mix(in srgb,var(--ac) 16%,transparent);border-radius:14px;width:54px;margin:0 auto 2px}
.fab{bottom:calc(98px + env(safe-area-inset-bottom,0px));border-radius:20px;box-shadow:0 12px 26px -8px var(--ac)}.toast{bottom:170px}
.cd.today{background:var(--ac);color:var(--acx);border-color:var(--ac)}.cd.today em{background:var(--acx);color:var(--ac)}
.top img{box-shadow:0 0 0 2px var(--ac)}
.xp{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px;width:150px}.xp i{display:block;height:100%;width:0;background:var(--ac);transition:width .7s}
#cmd{border:1px dashed var(--ac)}#busca{border-radius:14px}.cnt{color:var(--br);font-size:20px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;margin:10px 0}.heat i{aspect-ratio:1;border-radius:4px;background:var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Interface 2.0: camadas visuais sem alterar a estrutura de dados */
:root:root:root{--bg:#f3f6fb;--card:#ffffff;--ink:#14213b;--mut:#62728d;--line:#e0e7f2;--ac:#183d78;--br:#183d78;--sh:0 8px 30px rgba(21,43,83,.065)}
@media(prefers-color-scheme:dark){:root:root:root{--bg:#0c1425;--card:#162238;--ink:#edf3ff;--mut:#aab9d0;--line:#30405c;--ac:#8eb7ff;--br:#a6c8ff}}
body{font-size:16px}main{max-width:780px;padding:18px 16px}.top{max-width:780px;padding:22px 18px 8px}.top b{font-size:21px}.hero{padding:22px;border-radius:24px}.card{border-radius:18px}.it{padding:15px}.fab{background:#d63c4a;color:white;box-shadow:0 8px 24px #d63c4a55}.pri{border-radius:12px}.cd{border-radius:10px}.it:focus-within,.card:focus-within{outline:2px solid var(--ac);outline-offset:2px}
@media(min-width:850px){nav{max-width:740px}}
@media print{nav,.fab,.top,.noprint,.toast,button.sec{display:none!important}body{background:#fff;color:#000;padding:0}.card,.hero{box-shadow:none}}
</style>
</head>

<script>
const KEY="meudia_v1";
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const T0=()=>iso(new Date());
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmt=s=>cap(pd(s).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}));
const MOOD={tranquilo:["Tranquilo","g"],corrido:["Corrido","y"],pesado:["Pesado","r"]};
const PRIO={urgente:["Urgente","r"],normal:["Normal","y"],leve:["Leve","g"]};
const TIPO={cad:"CAD",defensoria:"Defensoria",admin:"Administrativo",atendimento:"Atendimento",pessoal:"Pessoal"};
let S,ui={tab:"hoje",date:T0(),month:T0().slice(0,7),af:"todos"};

function seed(){const t=T0();return{days:{},items:[
 {id:uid(),date:t,time:"09:00",title:"Exemplo: conferir nomeações da CAD",kind:"tarefa",prio:"urgente",tipo:"cad",done:false},
 {id:uid(),date:t,time:"14:00",title:"Exemplo: reunião com a Defensoria",kind:"comp",prio:"normal",tipo:"defensoria",done:false},
 {id:uid(),date:t,time:"",title:"Exemplo: organizar arquivos",kind:"tarefa",prio:"leve",tipo:"admin",done:false},

function load(){const raw=localStorage.getItem(KEY);if(!raw){S=seed();return}try{const parsed=JSON.parse(raw);if(!validData(parsed))throw Error("Estrutura inválida");S=parsed}catch(e){S={items:[],days:{}};window.addEventListener("load",()=>alert("Não foi possível ler os dados existentes. Nenhum dado foi apagado. Exporte o backup original antes de criar novos registros."),{once:true});window.__dataReadError=true}}
function validData(d){return !!d&&typeof d==="object"&&!Array.isArray(d)&&Array.isArray(d.items)&&d.days&&typeof d.days==="object"&&!Array.isArray(d.days)&&d.items.every(i=>i&&typeof i==="object"&&typeof i.id==="string"&&typeof i.title==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(i.date))}

function sv(){if(window.__dataReadError){toast("Dados originais protegidos. Não foi possível salvar.");return}try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Armazenamento cheio ou indisponível. Faça backup.")}}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
const cmp=(a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")||(a.done-b.done);
const stat=i=>i.done?"ok":i.date<T0()?"late":"pend";

function card(i){return`<div class="it p-${i.prio||"normal"} ${i.done?"dn":""}"><button class="ck" data-a="tog" data-id="${i.id}" aria-label="Concluir">${i.done?"✓":""}</button><div class="grow" data-a="edit" data-id="${i.id}"><b>${esc(i.title)}</b>${i.note?`<div class="meta">📝 ${esc(i.note)}</div>`:""}<div class="meta">${i.kind==="comp"?"🗓 ":""}${i.time?esc(i.time)+" · ":""}<span class="tg t-${i.tipo}">${TIPO[i.tipo]}</span>${stat(i)==="late"?' · <span class="lt">Atrasada em '+i.date.split("-").reverse().slice(0,2).join("/")+'</span>':""}</div></div></div>`}

function vCal(){
 const[y,m]=ui.month.split("-").map(Number),off=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate(),t=T0();
 let c=["D","S","T","Q","Q","S","S"].map(w=>`<div class="wd">${w}</div>`).join("")+"<div></div>".repeat(off);
 for(let d=1;d<=n;d++){const ds=`${y}-${pad(m)}-${pad(d)}`,dy=S.days[ds],its=S.items.filter(i=>i.date===ds),late=its.some(i=>!i.done&&ds<t),pend=its.filter(i=>!i.done).length;
  c+=`<button class="cd ${dy&&dy.mood?"hm-"+dy.mood:""} ${ds===t?"today":""} ${ds===ui.date?"sel":""}" data-a="pick" data-d="${ds}"><span>${d}</span>${its.length?`<em class="${late?"lt2":""}">${pend||"✓"}</em>`:""}</button>`}
 return`<div class="row sp" style="margin-bottom:12px"><button class="icb" data-a="mv" data-n="-1" aria-label="Mês anterior">‹</button><h1>${cap(new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}))}</h1><button class="icb" data-a="mv" data-n="1" aria-label="Próximo mês">›</button></div>
 <div class="cal">${c}</div><div class="leg"><span><i class="bg-g"></i>Tranquilo</span><span><i class="bg-y"></i>Corrido</span><span><i class="bg-r"></i>Pesado</span><span><em class="tg" style="background:var(--ac)">3</em>pendentes</span><span><em class="tg" style="background:var(--r)">2</em>atrasados</span></div>
 <p class="sub">Toque num dia para abrir. A cor do dia é a que você marca em “Como foi o dia?”.</p>`}

function vAgenda(){
 const t=T0(),f=ui.af,ok=i=>f==="todos"||(f==="comp"?i.kind==="comp":i.kind!=="comp");
 const late=S.items.filter(i=>i.date<t&&!i.done&&ok(i)).sort((a,b)=>a.date<b.date?-1:1);
 const up=S.items.filter(i=>i.date>=t&&i.date<=add(t,30)&&!i.done&&ok(i)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:cmp(a,b));
 let g="",last="";up.forEach(i=>{if(i.date!==last){g+=`<h2>${i.date===t?"Hoje":i.date===add(t,1)?"Amanhã":fmt(i.date)}</h2>`;last=i.date}g+=card(i)});
 return`<h1 style="margin-bottom:12px">Agenda</h1><input id="busca" placeholder="Buscar em tudo (título ou detalhes)" value="${esc(ui.q||"")}"><div id="lista">${ui.q?achados():""}</div><div id="norm"${ui.q?" hidden":""}><div class="chips">${[["todos","Tudo"],["comp","Compromissos"],["tarefa","Tarefas"]].map(([k,l])=>`<button class="chip ${f===k?"on":""}" data-a="af" data-v="${k}">${l}</button>`).join("")}</div>
 ${late.length?`<h2 style="color:var(--r)">Atrasadas (${late.length})</h2>${late.map(card).join("")}`:""}${g||'<div class="empty">Nada pendente nos próximos 30 dias.</div>'}</div>`}

function vBal(){
 const t=T0(),a=add(t,-29),its=S.items.filter(i=>i.date>=a&&i.date<=t),done=its.filter(i=>i.done).length,pc=its.length?Math.round(done/its.length*100):0;
 const mc={tranquilo:0,corrido:0,pesado:0};Object.entries(S.days).forEach(([d,v])=>{if(d>=a&&d<=t&&v.mood)mc[v.mood]++});const mt=Object.values(mc).reduce((x,y)=>x+y,0);
 const tp={};its.forEach(i=>tp[i.tipo]=(tp[i.tipo]||0)+1);const mx=Math.max(1,...Object.values(tp));
 return`<h1 style="margin-bottom:4px">Balanço</h1><div class="sub" style="margin-bottom:12px">Últimos 30 dias</div>
 <div class="card"><b>Tarefas e compromissos concluídos: ${pc}%</b><div class="bar"><span style="width:${pc}%;background:var(--ac)"></span></div><span class="sub">${done} de ${its.length}</span></div>
 <div class="card"><b>Como foram os dias</b>${Object.entries(MOOD).map(([k,v])=>`<div style="margin-top:8px">${v[0]}: ${mc[k]} dia(s)</div><div class="bar"><span class="bg-${v[1]}" style="width:${mt?mc[k]/mt*100:0}%"></span></div>`).join("")}</div>
 <div class="card"><b>Constância (12 semanas)</b><div class="heat">${heat()}</div><div class="sub">Quanto mais forte o azul, mais concluído no dia.</div></div>
 <div class="card"><b>Onde foi o tempo</b>${Object.keys(TIPO).map(k=>`<div style="margin-top:8px">${TIPO[k]}: ${tp[k]||0}</div><div class="bar"><span class="t-${k}" style="width:${(tp[k]||0)/mx*100}%"></span></div>`).join("")}</div>
 <div class="card row"><span style="font-size:36px">🔥</span><div><b>${streak()} dia(s) seguidos</b><div class="sub">com tudo concluído</div></div></div>
 <div class="card"><b>Avisos de compromissos</b><p class="sub">Ative para receber aviso na hora que você escolher. Funcionam com o app aberto ou instalado no celular.</p><button class="pri" data-a="ativ">Ativar avisos</button></div>
 <div class="card"><b>Instalar como app</b><p class="sub">Android: menu ⋮ do Chrome e “Instalar app”.<br>iPhone: botão Compartilhar do Safari e “Adicionar à Tela de Início”.</p></div>
 <div class="card"><b>Seus dados</b><p class="sub">Ficam somente neste navegador. Faça backup regularmente e guarde o arquivo em local privado.</p><div class="row" style="flex-wrap:wrap"><button class="pri" data-a="download">Baixar backup .json</button><button class="sec" data-a="bk">Copiar</button><button class="sec" data-a="rs">Restaurar</button></div></div>`}

function R(){
 $("nav").innerHTML=[["hoje","📅","Hoje"],["cal","🗓️","Calendário"],["dem","📌","Demandas"],["rot","✅","Rotinas"],["mais","⋯","Mais"]].map(([k,e,l])=>`<button class="${(k==="mais"?MAIS.includes(ui.tab):ui.tab===k)?"on":""}" data-a="tab" data-v="${k}"><b>${e}</b>${l}</button>`).join("");
 $("app").innerHTML=(MAIS.includes(ui.tab)&&ui.tab!=="mais"?'<button class="sec noprint" data-a="tab" data-v="mais" style="margin-bottom:10px">‹ Mais</button>':"")+({hoje:vHoje,cal:vCal,agenda:vAgenda,bal:vBal,dem:vDem,rot:vRot,ctt:vCtt,notas:vNotas,rel:vRel,mais:vMais})[ui.tab]();lvl();
}
function modal(h){X();const m=document.createElement("div");m.className="modal";m.id="modal";m.dataset.a="x";m.innerHTML=`<div class="sheet">${h}</div>`;document.body.appendChild(m)}
function X(){const m=$("modal");if(m)m.remove()}
const opt=(o,s)=>Object.entries(o).map(([k,v])=>`<option value="${k}"${k===s?" selected":""}>${Array.isArray(v)?v[0]:v}</option>`).join("");

function form(id){
 const i=id?S.items.find(x=>x.id===id):{date:ui.date,time:"",title:"",kind:"tarefa",prio:"normal",tipo:"admin"};
 modal(`<h2 style="margin-top:0">${id?"Editar":"Novo item"}</h2>
 <label>O que é?</label><input id="f_t" value="${esc(i.title)}" placeholder="Ex.: Enviar lista de nomeações"><label>Detalhes (opcional)</label><textarea id="f_n" rows="2">${esc(i.note||"")}</textarea>
 <div class="row"><div class="grow"><label>Tipo de item</label><select id="f_k"><option value="tarefa"${i.kind==="tarefa"?" selected":""}>Tarefa</option><option value="comp"${i.kind==="comp"?" selected":""}>Compromisso</option></select></div><div class="grow"><label>Prioridade</label><select id="f_p">${opt(PRIO,i.prio)}</select></div></div>
 <div class="row"><div class="grow"><label>Data</label><input id="f_d" type="date" value="${i.date}"></div><div class="grow"><label>Hora</label><input id="f_h" type="time" value="${i.time||""}"></div></div>
 <label>Atividade</label><select id="f_a">${opt(TIPO,i.tipo)}</select>
 <label>Avisar antes (precisa de hora)</label><select id="f_m">${remOpts(i.rem)}</select>
 ${id?"":`<label>Repetir</label><select id="f_r"><option value="">Não repete</option><option value="util">Todo dia útil (30 dias)</option><option value="sem">Toda semana (12 semanas)</option><option value="mes">Todo mês (6 meses)</option></select>`}
 <div class="row"><button class="pri grow" data-a="save" data-id="${id||""}">Salvar</button>${id?`<button class="sec" data-a="del" data-id="${id}">Excluir</button>`:""}<button class="sec" data-a="x">Fechar</button></div>`)}
function save(id){
 const t=$("f_t").value.trim();if(!t){toast("Escreva o que é");return}
 const b={title:t,kind:$("f_k").value,prio:$("f_p").value,date:$("f_d").value||T0(),time:$("f_h").value,tipo:$("f_a").value,rem:$("f_m").value,note:$("f_n").value};
 if(id){Object.assign(S.items.find(x=>x.id===id),b)}
 else{const r=$("f_r").value,ds=[b.date];
  if(r==="sem")for(let k=1;k<12;k++)ds.push(add(b.date,7*k));
  if(r==="mes")for(let k=1;k<6;k++){const d=pd(b.date);d.setMonth(d.getMonth()+k);ds.push(iso(d))}
  if(r==="util"){ds.length=0;for(let k=0;k<30;k++){const d=add(b.date,k),w=pd(d).getDay();if(w>0&&w<6)ds.push(d)}}
  ds.forEach(d=>S.items.push({...b,date:d,id:uid(),done:false}))}
 sv();X();R();toast("Salvo")}

function backupFile(){const payload={format:"prioridade-servico",version:2,exportedAt:new Date().toISOString(),data:S};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="prioridade-backup-"+T0()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Backup preparado")}
const A={
 download:backupFile,
